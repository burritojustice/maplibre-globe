<!DOCTYPE html>
<html lang="en">
<head>
    <title>World Map Quiz</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Mono', monospace;
            background: #0a0a0f;
            color: #e8e8d0;
            height: 100vh;
            overflow: hidden;
        }

        html, body, #map { height: 100%; }
        #map { position: absolute; inset: 0; }

        /* ── HUD ── */
        #hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            pointer-events: none;
        }

        #top-bar {
            display: flex;
            align-items: stretch;
            background: #0a0a0f;
            border-bottom: 2px solid #f0e040;
            pointer-events: all;
        }

        #title-block {
            padding: 12px 20px;
            border-right: 2px solid #f0e040;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #title-block h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
            color: #f0e040;
            line-height: 1;
        }
        #title-block span {
            font-size: 9px;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            margin-top: 2px;
        }

        #score-block {
            padding: 12px 20px;
            border-right: 2px solid #f0e040;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 120px;
        }
        #score-block .label {
            font-size: 9px;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
        }
        #score-display {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            color: #f0e040;
            line-height: 1;
        }

        #progress-block {
            padding: 12px 20px;
            border-right: 2px solid #f0e040;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 160px;
        }
        #progress-block .label {
            font-size: 9px;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        #progress-bar-outer {
            height: 8px;
            background: #222;
            border: 1px solid #444;
        }
        #progress-bar-inner {
            height: 100%;
            background: #f0e040;
            transition: width 0.4s ease;
            width: 0%;
        }
        #progress-text {
            font-size: 10px;
            color: #888;
            margin-top: 3px;
        }

        #continent-select-block {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        #continent-select-block .label {
            font-size: 9px;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            white-space: nowrap;
        }
        #continent-select {
            background: #111;
            color: #f0e040;
            border: 1px solid #444;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            padding: 6px 10px;
            cursor: pointer;
            outline: none;
        }
        #continent-select:hover { border-color: #f0e040; }

        #start-btn {
            margin-left: auto;
            background: #f0e040;
            color: #0a0a0f;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
            padding: 0 28px;
            cursor: pointer;
            transition: background 0.15s;
            pointer-events: all;
        }
        #start-btn:hover { background: #fff; }
        #start-btn:disabled { background: #444; color: #666; cursor: not-allowed; }

        /* ── Question card ── */
        #question-card {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: #0a0a0f;
            border: 2px solid #f0e040;
            padding: 20px 32px;
            min-width: 340px;
            max-width: 520px;
            text-align: center;
            display: none;
        }
        #question-label {
            font-size: 9px;
            letter-spacing: 3px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        #country-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 42px;
            color: #f0e040;
            letter-spacing: 2px;
            line-height: 1;
        }
        #feedback {
            margin-top: 10px;
            font-size: 13px;
            min-height: 20px;
            letter-spacing: 1px;
        }
        #feedback.correct { color: #50e080; }
        #feedback.wrong   { color: #e05050; }
        #feedback.info    { color: #f0e040; }

        #action-btns {
            display: none;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
        }
        .action-btn {
            background: transparent;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.15s;
        }
        #try-again-btn {
            color: #f0e040;
            border: 1px solid #f0e040;
        }
        #try-again-btn:hover { background: #f0e04022; }
        #skip-btn {
            color: #666;
            border: 1px solid #333;
        }
        #skip-btn:hover { border-color: #888; color: #aaa; }

        /* ── Small country markers ── */
        .small-country-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid #d4d4d4; /* default; overridden per-marker by JS */
            cursor: pointer;
            box-sizing: border-box;
            pointer-events: all;
            /* sit behind the country polygon tiles */
            position: relative;
            z-index: 0;
        }

        /* ── Results panel ── */
        #results-panel {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(10,10,15,0.94);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #results-inner {
            background: #0a0a0f;
            border: 2px solid #f0e040;
            padding: 28px 36px;
            width: min(860px, 94vw);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        #results-inner h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 48px;
            color: #f0e040;
            letter-spacing: 4px;
            line-height: 1;
        }
        #results-inner .sub {
            font-size: 10px;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            margin: 4px 0 14px;
        }
        #results-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        #final-score-big {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            line-height: 1;
            color: #f0e040;
        }
        #results-legend {
            font-size: 11px;
            color: #999;
            text-align: left;
            line-height: 2.2;
        }
        #results-legend .leg-icon { display: inline-block; width: 22px; }

        /* Scrollable two-column breakdown */
        #results-breakdown-wrap {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            border: 1px solid #1e1e1e;
            margin-bottom: 14px;
        }
        #results-breakdown {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 12px;
            border-bottom: 1px solid #181818;
            font-size: 11px;
        }
        .result-row:nth-child(odd)  { border-right: 1px solid #181818; }
        .result-row .country        { text-align: left; color: #ccc; }
        .status-ok   { color: #50e080; font-size: 15px; }
        .status-warn { color: #f0e040; font-size: 15px; }
        .status-skip { color: #e05050; font-size: 15px; }

        #results-summary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0;
            border: 1px solid #1e1e1e;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .summary-cell {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #aaa;
        }
        .summary-cell:not(:last-child) { border-right: 1px solid #1e1e1e; }
        .summary-cell .sum-icon { font-size: 16px; flex-shrink: 0; }
        .summary-cell .sum-label { color: #777; font-size: 10px; display: block; }
        .summary-cell .sum-count {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 26px;
            line-height: 1;
        }
        .summary-cell .sum-pct { font-size: 10px; color: #666; }

        #results-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        #retry-btn, #new-continent-btn {
            background: transparent;
            border: 2px solid #f0e040;
            color: #f0e040;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
            padding: 10px 28px;
            cursor: pointer;
            transition: all 0.15s;
        }
        #retry-btn:hover, #new-continent-btn:hover {
            background: #f0e040;
            color: #0a0a0f;
        }
        #retry-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #retry-btn:disabled:hover { background: transparent; color: #f0e040; }

        .maplibregl-ctrl-bottom-right,
        .maplibregl-ctrl-bottom-left { display: none; }
    </style>
</head>
<body>

<div id="map"></div>

<!-- HUD -->
<div id="hud">
    <div id="top-bar">
        <div id="title-block">
            <h1>GeoQuiz</h1>
            <span>World Map Challenge</span>
        </div>
        <div id="score-block">
            <div class="label">Score</div>
            <div id="score-display">0 / 0</div>
        </div>
        <div id="progress-block">
            <div class="label">Progress</div>
            <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
            <div id="progress-text">— countries remaining</div>
        </div>
        <div id="continent-select-block">
            <span class="label">Continent</span>
            <select id="continent-select">
                <option value="">— pick a continent —</option>
                <option value="Africa">Africa</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="North America">North America</option>
                <option value="South America">South America</option>
                <option value="Oceania">Oceania</option>
                <option value="ALL">🌍 All Continents</option>
            </select>
        </div>
        <button id="start-btn" disabled>START</button>
    </div>
</div>

<!-- Question card -->
<div id="question-card">
    <div id="question-label">Find this country on the map</div>
    <div id="country-name">—</div>
    <div id="feedback"></div>
    <div id="action-btns">
        <button class="action-btn" id="try-again-btn">try again</button>
        <button class="action-btn" id="skip-btn">skip (give up)</button>
    </div>
</div>

<!-- Results -->
<div id="results-panel">
    <div id="results-inner">
        <h2>Round Complete</h2>
        <div class="sub">Here's how you did</div>
        <div id="results-top">
            <div id="final-score-big">0%</div>
            <div id="results-legend">
                <div><span class="leg-icon status-ok">✓</span> Got it first try</div>
                <div><span class="leg-icon status-warn">?</span> Eventually got it</div>
                <div><span class="leg-icon status-skip">→</span> Skipped / gave up</div>
            </div>
        </div>
        <div id="results-breakdown-wrap">
            <div id="results-breakdown"></div>
        </div>
        <div id="results-summary">
            <div class="summary-cell">
                <span class="sum-icon status-ok">✓</span>
                <div>
                    <span class="sum-label">First try</span>
                    <span class="sum-count" id="sum-correct">0</span>
                    <span class="sum-pct" id="sum-correct-pct"></span>
                </div>
            </div>
            <div class="summary-cell">
                <span class="sum-icon status-warn">?</span>
                <div>
                    <span class="sum-label">Eventually</span>
                    <span class="sum-count" id="sum-eventual">0</span>
                    <span class="sum-pct" id="sum-eventual-pct"></span>
                </div>
            </div>
            <div class="summary-cell">
                <span class="sum-icon status-skip">→</span>
                <div>
                    <span class="sum-label">Skipped</span>
                    <span class="sum-count" id="sum-skipped">0</span>
                    <span class="sum-pct" id="sum-skipped-pct"></span>
                </div>
            </div>
        </div>
        <div id="results-btns">
            <button id="retry-btn">Retry Skipped</button>
            <button id="new-continent-btn">New Quiz</button>
        </div>
    </div>
</div>

// ─── Parse CSV ───────────────────────────────────────────────────────────────
function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',');
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
        const row = {};
        const line = lines[i];
        const fields = [];
        let cur = '', inQ = false;
        for (let c of line) {
            if (c === '"') { inQ = !inQ; }
            else if (c === ',' && !inQ) { fields.push(cur); cur = ''; }
            else { cur += c; }
        }
        fields.push(cur);
        headers.forEach((h, idx) => row[h.trim()] = (fields[idx] || '').trim());
        rows.push(row);
    }
    return rows;
}

const allCountryData = parseCSV(CSV);
const seen = new Set();
const countries = allCountryData.filter(r => {
    const code = r['Three_Letter_Country_Code'];
    if (!code || seen.has(code)) return false;
    seen.add(code);
    return true;
});

function displayName(raw) {
    const m = raw.match(/^([^,]+),\s(.+)$/);
    return m ? m[1].trim() : raw;
}

// ─── Quiz state ───────────────────────────────────────────────────────────────
let quizQueue     = [];
let currentQ      = null;
let correctCount  = 0;
let totalAnswered  = 0;
let quizActive    = false;
let waitingForNext = false;
let wrongThisQ    = false;   // had at least one wrong click this question
let results       = [];      // {name, code, status: 'correct'|'eventual'|'skipped'}
let skippedQueue  = [];

// ─── UI refs ─────────────────────────────────────────────────────────────────
const continentSelect  = document.getElementById('continent-select');
const startBtn         = document.getElementById('start-btn');
const questionCard     = document.getElementById('question-card');
const countryNameEl    = document.getElementById('country-name');
const feedbackEl       = document.getElementById('feedback');
const actionBtns       = document.getElementById('action-btns');
const tryAgainBtn      = document.getElementById('try-again-btn');
const skipBtn          = document.getElementById('skip-btn');
const scoreDisplay     = document.getElementById('score-display');
const progressBarInner = document.getElementById('progress-bar-inner');
const progressText     = document.getElementById('progress-text');
const resultsPanel     = document.getElementById('results-panel');
const finalScoreBig    = document.getElementById('final-score-big');
const resultsBreakdown = document.getElementById('results-breakdown');
const retryBtn         = document.getElementById('retry-btn');
const newContinentBtn  = document.getElementById('new-continent-btn');

// ─── Continent map filter ─────────────────────────────────────────────────────
function getContinentCodes(continent) {
    if (continent === 'ALL' || !continent) return null;
    return countries
        .filter(c => c['Continent_Name'] === continent)
        .map(c => c['Three_Letter_Country_Code'])
        .filter(Boolean);
}

function applyMapContinentFilter(continent) {
    const codes = getContinentCodes(continent);
    const layers = ['countries-fill', 'countries-boundary', 'coastline'];
    if (!codes) {
        layers.forEach(l => { try { map.setFilter(l, null); } catch(e){} });
    } else {
        const f = ['in', ['get', 'ADM0_A3'], ['literal', codes]];
        layers.forEach(l => { try { map.setFilter(l, f); } catch(e){} });
    }
    // Show/hide small-country markers based on continent
    Object.entries(allMarkers).forEach(([code, { el }]) => {
        if (!codes || codes.includes(code)) {
            el.style.display = '';
        } else {
            el.style.display = 'none';
        }
    });
}

function zoomToContinent(continent) {
    if (!continent || continent === 'ALL') {
        map.flyTo({ center: [10, 20], zoom: 1.5, duration: 1200 });
        return;
    }
    const bounds = CONTINENT_BOUNDS[continent];
    if (!bounds) return;
    map.fitBounds(bounds, { padding: 40, duration: 1200, maxZoom: 5 });
}

continentSelect.addEventListener('change', () => {
    startBtn.disabled = !continentSelect.value;
    if (map.isStyleLoaded()) {
        applyMapContinentFilter(continentSelect.value);
        zoomToContinent(continentSelect.value);
    }
});

// ─── Map ──────────────────────────────────────────────────────────────────────
const map = new maplibregl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json',
    zoom: 1.5,
    center: [10, 20],
    maxZoom: 6,
    minZoom: 1
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');

map.on('style.load', () => {
    map.setProjection({ type: 'globe' });
    map.setLayoutProperty('countries-label', 'visibility', 'none');

    // Hover — solid white
    map.addSource('hover-country', { type: 'geojson', data: emptyFC() });
    map.addLayer({ id: 'hover-fill', type: 'fill', source: 'hover-country',
        paint: { 'fill-color': '#ffffff', 'fill-opacity': 1 } });

    // Flash correct — solid bright green
    map.addSource('flash-correct', { type: 'geojson', data: emptyFC() });
    map.addLayer({ id: 'flash-correct-fill', type: 'fill', source: 'flash-correct',
        paint: { 'fill-color': '#00ff66', 'fill-opacity': 1 } });

    // Flash wrong — solid bright red
    map.addSource('flash-wrong', { type: 'geojson', data: emptyFC() });
    map.addLayer({ id: 'flash-wrong-fill', type: 'fill', source: 'flash-wrong',
        paint: { 'fill-color': '#ff2222', 'fill-opacity': 1 } });

    // Reveal after skip — solid yellow + outline
    map.addSource('reveal-country', { type: 'geojson', data: emptyFC() });
    map.addLayer({ id: 'reveal-fill', type: 'fill', source: 'reveal-country',
        paint: { 'fill-color': '#f0e040', 'fill-opacity': 1 } });
    map.addLayer({ id: 'reveal-line', type: 'line', source: 'reveal-country',
        paint: { 'line-color': '#f0e040', 'line-width': 2 } });

    // Hover tracking
    let hoveredCode = null;
    map.on('mousemove', 'countries-fill', (e) => {
        if (!quizActive || waitingForNext) return;
        const code = e.features[0].properties.ADM0_A3;
        if (code === hoveredCode) return;
        hoveredCode = code;
        setSource('hover-country', getFeaturesForCode(code));
    });
    map.on('mouseleave', 'countries-fill', () => {
        hoveredCode = null;
        setSource('hover-country', []);
    });
    map.on('mouseenter', 'countries-fill', () => {
        if (quizActive && !waitingForNext) map.getCanvas().style.cursor = 'crosshair';
    });
    map.on('mouseleave', 'countries-fill', () => { map.getCanvas().style.cursor = ''; });
    map.on('click', 'countries-fill', (e) => {
        if (!quizActive || waitingForNext) return;
        handleAnswer(e.features[0].properties.ADM0_A3);
    });

    // Build all small-country markers once tiles are ready
    map.once('idle', buildAllMarkers);
});

// ─── Map helpers ──────────────────────────────────────────────────────────────
function emptyFC() { return { type: 'FeatureCollection', features: [] }; }

function getFeaturesForCode(code) {
    return map.querySourceFeatures('maplibre', {
        sourceLayer: 'countries',
        filter: ['==', ['get', 'ADM0_A3'], code]
    });
}

function setSource(sourceId, features) {
    const src = map.getSource(sourceId);
    if (!src) return;
    src.setData({
        type: 'FeatureCollection',
        features: features.map(f => ({ type: 'Feature', geometry: f.geometry, properties: f.properties }))
    });
}

function clearAll() {
    ['hover-country', 'flash-correct', 'flash-wrong', 'reveal-country'].forEach(s => setSource(s, []));
}

// Blink a country N times on the given source, call done() when finished
function blinkCountry(code, sourceId, times, intervalMs, done) {
    const feats = getFeaturesForCode(code);
    let count = 0, on = false;
    const tick = setInterval(() => {
        on = !on;
        setSource(sourceId, on ? feats : []);
        if (++count >= times * 2) {
            clearInterval(tick);
            setSource(sourceId, []);
            if (done) done();
        }
    }, intervalMs);
}

// ─── Small country markers ─────────────────────────────────────────────────────
// allMarkers: code → { marker, el }
const allMarkers = {};

// The base country fill color from the demotiles style
const COUNTRY_FILL_COLOR = '#d4d4d4'; // approximation of the basemap's country color

function buildAllMarkers() {
    // Read the actual fill color from the map style for the border
    let borderColor = COUNTRY_FILL_COLOR;
    try {
        const paint = map.getPaintProperty('countries-fill', 'fill-color');
        if (typeof paint === 'string') borderColor = paint;
    } catch(e) {}

    Object.entries(SMALL_COUNTRY_CENTROIDS).forEach(([code, coords]) => {
        const el = document.createElement('div');
        el.className = 'small-country-marker';
        el.style.borderColor = borderColor;
        el.dataset.code = code;
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!quizActive || waitingForNext) return;
            handleAnswer(code);
        });
        const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
            .setLngLat(coords)
            .addTo(map);
        allMarkers[code] = { marker, el, borderColor, coords, visible: true };
    });

    // Cull markers that are on the back of the globe on every render
    map.on('render', cullGlobeMarkers);
}

// Hide markers that are on the back hemisphere of the globe.
// We check if the angular distance from the map center to the marker
// exceeds 90° — if so, it's over the horizon.
function cullGlobeMarkers() {
    const center = map.getCenter();
    const cLat = center.lat * Math.PI / 180;
    const cLng = center.lng * Math.PI / 180;

    Object.values(allMarkers).forEach(({ el, coords }) => {
        if (el.style.display === 'none') return; // hidden by continent filter
        const [lng, lat] = coords;
        const pLat = lat * Math.PI / 180;
        const pLng = lng * Math.PI / 180;
        // Dot product of the two unit vectors on the sphere
        const dot = Math.sin(cLat) * Math.sin(pLat) +
                    Math.cos(cLat) * Math.cos(pLat) * Math.cos(pLng - cLng);
        // dot > 0 means same hemisphere (within 90°), dot <= 0 means behind
        el.style.visibility = dot > 0 ? '' : 'hidden';
    });
}

function setActiveMarker(code) { /* no-op: we don't highlight the current question */ }
function clearActiveMarker()   { /* no-op */ }

// Blink the marker dot for a given code in sync with the country flash
function blinkMarker(code, color, times, intervalMs) {
    const entry = allMarkers[code];
    if (!entry) return;
    const el = entry.el;
    const originalBorder = entry.borderColor || COUNTRY_FILL_COLOR;
    let count = 0, on = false;
    const tick = setInterval(() => {
        on = !on;
        el.style.borderColor = on ? color : originalBorder;
        if (++count >= times * 2) {
            clearInterval(tick);
            el.style.borderColor = originalBorder;
        }
    }, intervalMs);
}

// ─── Quiz logic ───────────────────────────────────────────────────────────────
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function buildQueue(continent) {
    const list = continent === 'ALL' ? countries
               : countries.filter(c => c['Continent_Name'] === continent);
    return shuffle(list.map(c => ({
        name: displayName(c['Country_Name']),
        code: c['Three_Letter_Country_Code']
    })));
}

startBtn.addEventListener('click', () => {
    const continent = continentSelect.value;
    if (!continent) return;
    quizQueue     = buildQueue(continent);
    skippedQueue  = [];
    results       = [];
    correctCount  = 0;
    totalAnswered = 0;
    quizActive    = true;
    resultsPanel.style.display = 'none';
    clearAll();
    clearActiveMarker();
    applyMapContinentFilter(continent);
    zoomToContinent(continent);
    updateScore();
    nextQuestion();
});

function nextQuestion() {
    waitingForNext = false;
    wrongThisQ     = false;
    clearAll();
    clearActiveMarker();
    feedbackEl.textContent   = '';
    feedbackEl.className     = '';
    actionBtns.style.display = 'none';

    if (quizQueue.length === 0) { endRound(); return; }

    currentQ = quizQueue.pop();
    countryNameEl.textContent  = currentQ.name;
    questionCard.style.display = 'block';
    updateProgress();
}

function handleAnswer(clickedCode) {
    if (!quizActive || waitingForNext) return;

    if (clickedCode === currentQ.code) {
        // ── CORRECT ──
        waitingForNext = true;
        clearActiveMarker();
        setSource('hover-country', []);
        blinkMarker(currentQ.code, '#00ff66', 3, 150);
        blinkCountry(currentQ.code, 'flash-correct', 3, 150, () => {
            const status = wrongThisQ ? 'eventual' : 'correct';
            if (status === 'correct') correctCount++;
            totalAnswered++;
            results.push({ name: currentQ.name, code: currentQ.code, status });
            feedbackEl.textContent = wrongThisQ ? '✓ Got it!' : '✓ Correct!';
            feedbackEl.className   = 'correct';
            updateScore();
            setTimeout(nextQuestion, 700);
        });
    } else {
        // ── WRONG ──
        wrongThisQ = true;
        setSource('hover-country', []);
        blinkMarker(clickedCode, '#ff2222', 3, 150);
        blinkCountry(clickedCode, 'flash-wrong', 3, 150, () => {
            feedbackEl.textContent   = '✗ Wrong — try again or give up';
            feedbackEl.className     = 'wrong';
            actionBtns.style.display = 'flex';
        });
    }
}

tryAgainBtn.addEventListener('click', () => {
    actionBtns.style.display = 'none';
    feedbackEl.textContent   = '';
    feedbackEl.className     = '';
    clearAll();
});

skipBtn.addEventListener('click', () => {
    actionBtns.style.display = 'none';
    waitingForNext = true;
    clearActiveMarker();
    clearAll();

    // No highlight — just move on
    feedbackEl.textContent = `→ Skipped`;
    feedbackEl.className   = 'wrong';

    results.push({ name: currentQ.name, code: currentQ.code, status: 'skipped' });
    skippedQueue.push(currentQ);
    totalAnswered++;
    updateScore();
    setTimeout(nextQuestion, 1200);
});

function updateScore() {
    scoreDisplay.textContent = `${correctCount} / ${totalAnswered}`;
}

function updateProgress() {
    const total = quizQueue.length + totalAnswered + 1;
    const pct   = total > 0 ? Math.round((totalAnswered / total) * 100) : 0;
    progressBarInner.style.width = pct + '%';
    progressText.textContent = `${quizQueue.length + 1} remaining`;
}

function endRound() {
    quizActive = false;
    questionCard.style.display = 'none';
    clearAll();
    clearActiveMarker();

    const nCorrect  = results.filter(r => r.status === 'correct').length;
    const nEventual = results.filter(r => r.status === 'eventual').length;
    const nSkipped  = results.filter(r => r.status === 'skipped').length;
    const total     = results.length;

    const pct = total > 0 ? Math.round((nCorrect / total) * 100) : 0;
    finalScoreBig.textContent = pct + '%';

    // Per-country list
    let html = '';
    results.forEach(r => {
        const icon = r.status === 'correct'  ? '<span class="status-ok">✓</span>'
                   : r.status === 'eventual'  ? '<span class="status-warn">?</span>'
                   :                            '<span class="status-skip">→</span>';
        html += `<div class="result-row"><span class="country">${r.name}</span>${icon}</div>`;
    });
    if (results.length % 2 !== 0) html += `<div class="result-row"></div>`;
    resultsBreakdown.innerHTML = html;

    // Summary counts
    function pctStr(n) { return total > 0 ? `${Math.round(n/total*100)}%` : '—'; }
    document.getElementById('sum-correct').textContent      = nCorrect;
    document.getElementById('sum-correct-pct').textContent  = pctStr(nCorrect);
    document.getElementById('sum-eventual').textContent     = nEventual;
    document.getElementById('sum-eventual-pct').textContent = pctStr(nEventual);
    document.getElementById('sum-skipped').textContent      = nSkipped;
    document.getElementById('sum-skipped-pct').textContent  = pctStr(nSkipped);

    retryBtn.disabled = skippedQueue.length === 0;
    resultsPanel.style.display = 'flex';
}

retryBtn.addEventListener('click', () => {
    if (skippedQueue.length === 0) return;
    quizQueue     = shuffle([...skippedQueue]);
    skippedQueue  = [];
    results       = [];
    correctCount  = 0;
    totalAnswered = 0;
    quizActive    = true;
    resultsPanel.style.display = 'none';
    clearAll();
    clearActiveMarker();
    updateScore();
    nextQuestion();
});

newContinentBtn.addEventListener('click', () => {
    quizActive = false;
    resultsPanel.style.display = 'none';
    questionCard.style.display = 'none';
    clearAll();
    clearActiveMarker();
    correctCount  = 0;
    totalAnswered = 0;
    updateScore();
    progressBarInner.style.width = '0%';
    progressText.textContent = '— countries remaining';
    applyMapContinentFilter(null); // show all countries again
    zoomToContinent(null);         // zoom back to world view
});
</script>
