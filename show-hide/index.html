<!DOCTYPE html>
<html lang="en">
<head>
    <title>World Defense Plan</title>
    <meta property="og:description" content="World Defense Plan." />
    <meta property="og:title" content="World Defense Plan" />
    <meta property="og:description" content="An unbeatable defense for the world against America" />
    <meta property="og:image" content="https://burritojustice.github.io/maplibre-globe/greenland/preview.jpg" />
    <meta property="og:url" content="https://burritojustice.github.io/maplibre-globe/show-hide/" />
    <meta property="og:type" content="https://burritojustice.github.io/maplibre-globe/show-hide/" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js'></script>
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        .small-country-marker {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            border: 3px solid rgba(0, 0, 0, 0.45);
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .small-country-marker.selected {
            background: rgba(255, 0, 0, 0.45);
            border-color: #ff0000;
        }
        .small-country-marker.disabled {
            cursor: default;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const hideParam = urlParams.get('hide');
    const showParam = urlParams.get('show');
    
    // Set default values or use URL parameters
    const countriesToHide = hideParam ? hideParam.split(',').map(c => c.trim()) : ['GRL'];
    const countriesToShow = showParam ? showParam.split(',').map(c => c.trim()) : ['USA', 'CHN', 'RUS', 'BLR', 'PRK', 'HUN'];
    
    // Determine if we have URL parameters
    const hasUrlParams = hideParam || showParam;
    const hasOnlyHide = hideParam && !showParam;
    const hasOnlyShow = showParam && !hideParam;
    
    // ─── Small country markers ──────────────────────────────────────────────
    // Hardcoded centroids for micro-island / enclave nations whose polygons
    // are too small or scattered to reliably click at low zoom levels.
    const SMALL_COUNTRY_CENTROIDS = {
        AND: [   1.52,  42.55], // Andorra
        ASM: [-170.69, -14.27], // American Samoa
        ATG: [ -61.80,  17.07], // Antigua and Barbuda
        BHR: [  50.55,  26.03], // Bahrain
        BHS: [ -77.39,  25.03], // Bahamas
        BRB: [ -59.55,  13.17], // Barbados
        COM: [  43.87, -11.87], // Comoros
        CPV: [ -24.01,  16.00], // Cape Verde
        FJI: [ 178.06, -18.17], // Fiji
        FSM: [ 158.25,   6.92], // Micronesia
        GRD: [ -61.68,  12.12], // Grenada
        JAM: [ -77.30,  18.11], // Jamaica
        KIR: [ 173.00,   1.35], // Kiribati
        LIE: [   9.55,  47.14], // Liechtenstein
        MCO: [   7.42,  43.73], // Monaco
        MDV: [  73.22,   4.17], // Maldives
        MHL: [ 171.18,   7.13], // Marshall Islands
        MLT: [  14.51,  35.90], // Malta
        MUS: [  57.55, -20.29], // Mauritius
        NRU: [ 166.93,  -0.52], // Nauru
        PLW: [ 134.58,   7.51], // Palau
        SGP: [ 103.82,   1.35], // Singapore
        SLB: [ 160.15,  -9.43], // Solomon Islands
        SMR: [  12.46,  43.94], // San Marino
        STP: [   6.61,   0.19], // Sao Tome and Principe
        SYC: [  55.45,  -4.68], // Seychelles
        TON: [-175.20, -21.13], // Tonga
        TTO: [ -61.22,  10.65], // Trinidad and Tobago
        TUV: [ 179.20,  -8.52], // Tuvalu
        VAT: [  12.45,  41.90], // Vatican City
        WSM: [-172.10, -13.75], // Samoa
    };
    
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        zoom: 1.5,
        center: [-62.1, 61.7],
        maxZoom: 4.3
    });
    
    map.on('style.load', () => {
        map.setProjection({
            type: 'globe',
        });
        
        // Override to always show full country names
        map.setLayoutProperty('countries-label', 'text-field', ['get', 'NAME']);
        
        // Only show labels at zoom 4 and above
        map.setLayerZoomRange('countries-label', 3, 24);
        
        let codeToAbbrev = {};
        let abbrevToCode = {};
        let hideActive = false;
        let showActive = false;
        let selectedCountries = new Set();
        
        // ─── Crimea handling ─────────────────────────────────────────────────
        // In this basemap's data, Crimea is a separate polygon fragment tagged
        // with ADM0_A3 = 'RUS' (same as mainland Russia), so it can't be told
        // apart from Russia by country code alone. We detect it heuristically
        // by scanning common Natural-Earth-style name fields for "Crimea", then
        // build an exact-match expression from whichever field actually matched
        // so hide/show filters and outline queries can treat it as Ukrainian.
        let crimeaMatchKey = null;
        let crimeaMatchValue = null;
        
        function findCrimeaMatch(properties) {
            const candidates = ['NAME', 'NAME_LONG', 'GEOUNIT', 'SUBUNIT', 'BRK_NAME', 'FORMAL_EN', 'ADMIN', 'SOVEREIGNT'];
            for (const key of candidates) {
                const val = properties[key];
                if (typeof val === 'string' && val.toLowerCase().includes('crimea')) {
                    return { key, value: val };
                }
            }
            return null;
        }
        
        function crimeaFilterExpr() {
            if (!crimeaMatchKey) return null;
            return ['==', ['get', crimeaMatchKey], crimeaMatchValue];
        }
        
        // Add a layer for selected country outlines
        map.addSource('selected-countries', {
            type: 'geojson',
            data: {
                type: 'FeatureCollection',
                features: []
            }
        });
        
        map.addLayer({
            id: 'selected-countries-outline',
            type: 'line',
            source: 'selected-countries',
            paint: {
                'line-color': '#ff0000',
                'line-width': {
                    'stops': [
                        [1, 1],
                        [6, 2],
                        [14, 6],
                        [22, 12]
                    ]
                }
            }
        });
        
        // Function to update selected countries outline
        function updateSelectedOutline() {
            updateSmallCountryMarkerStyles();
            
            if (selectedCountries.size === 0) {
                map.getSource('selected-countries').setData({
                    type: 'FeatureCollection',
                    features: []
                });
                return;
            }
            
            const codesArr = Array.from(selectedCountries);
            const includeCrimea = crimeaMatchKey && selectedCountries.has('UKR');
            
            const queryFilter = includeCrimea
                ? ['any', ['in', ['get', 'ADM0_A3'], ['literal', codesArr]], crimeaFilterExpr()]
                : ['in', ['get', 'ADM0_A3'], ['literal', codesArr]];
            
            const features = map.querySourceFeatures('maplibre', {
                sourceLayer: 'countries',
                filter: queryFilter
            });
            
            console.log('Selected features for outline (raw fragments):', features.length);
            
            // Group tile fragments by country code, then union each group into
            // one polygon so internal tile-boundary seams don't get outlined.
            // Crimea fragments always group under Ukraine, regardless of their
            // raw ADM0_A3 value, so they merge with mainland Ukraine's outline.
            const byCountry = {};
            features.forEach(f => {
                const isCrimea = crimeaMatchKey && findCrimeaMatch(f.properties);
                const code = isCrimea ? 'UKR' : f.properties.ADM0_A3;
                if (!byCountry[code]) byCountry[code] = [];
                byCountry[code].push({
                    type: 'Feature',
                    geometry: f.geometry,
                    properties: f.properties
                });
            });
            
            const mergedFeatures = [];
            Object.keys(byCountry).forEach(code => {
                const parts = byCountry[code];
                if (parts.length === 1) {
                    mergedFeatures.push(parts[0]);
                    return;
                }
                try {
                    let merged = parts[0];
                    for (let i = 1; i < parts.length; i++) {
                        merged = turf.union(merged, parts[i]);
                    }
                    merged.properties = parts[0].properties;
                    mergedFeatures.push(merged);
                } catch (err) {
                    console.warn('Turf union failed for', code, '- falling back to raw fragments', err);
                    parts.forEach(p => mergedFeatures.push(p));
                }
            });
            
            console.log('Merged features for outline:', mergedFeatures.length);
            
            map.getSource('selected-countries').setData({
                type: 'FeatureCollection',
                features: mergedFeatures
            });
        }
        
        // Function to hide specific countries
        function hideCountries(countryList) {
            const layersToFilter = ['countries-fill', 'countries-boundary', 'coastline'];
            const notInList = ['!', ['in', ['get', 'ADM0_A3'], ['literal', countryList]]];
            const hidingUkraine = countryList.includes('UKR');
            
            // If Crimea is being hidden, only because Ukraine is hidden (rule:
            // hiding Ukraine hides Crimea). Otherwise Crimea always stays
            // visible, even if Russia is hidden.
            const filter = crimeaMatchKey
                ? ['all', ['case', crimeaFilterExpr(), !hidingUkraine, notInList]]
                : ['all', notInList];
            
            layersToFilter.forEach(layerId => {
                map.setFilter(layerId, filter);
            });
            
            const abbrevsToHide = countryList.map(code => codeToAbbrev[code]).filter(Boolean);
            
            map.setFilter('countries-label', [
                'all',
                ['!', ['in', ['get', 'ABBREV'], ['literal', abbrevsToHide]]]
            ]);
        }
        
        // Function to show only specific countries
        function showOnlyCountries(countryList) {
            const layersToFilter = ['countries-fill', 'countries-boundary', 'coastline'];
            const inList = ['in', ['get', 'ADM0_A3'], ['literal', countryList]];
            const showingUkraine = countryList.includes('UKR');
            
            // Crimea only appears if Ukraine is in the show list (rule: showing
            // only Russia hides Crimea; showing Ukraine shows Crimea).
            const filter = crimeaMatchKey
                ? ['all', ['case', crimeaFilterExpr(), showingUkraine, inList]]
                : ['all', inList];
            
            layersToFilter.forEach(layerId => {
                map.setFilter(layerId, filter);
            });
            
            const abbrevsToShow = countryList.map(code => codeToAbbrev[code]).filter(Boolean);
            
            map.setFilter('countries-label', [
                'all',
                ['in', ['get', 'ABBREV'], ['literal', abbrevsToShow]]
            ]);
        }
        
        // Function to remove filters (show all countries)
        function showAllCountries() {
            const layersToFilter = ['countries-fill', 'countries-boundary', 'coastline'];
            
            layersToFilter.forEach(layerId => {
                map.setFilter(layerId, null);
            });
            
            map.setFilter('countries-label', null);
        }
        
        // ─── Small country marker functions ─────────────────────────────────
        let smallCountryMarkers = {};
        
        function buildSmallCountryMarkers() {
            Object.entries(SMALL_COUNTRY_CENTROIDS).forEach(([code, coords]) => {
                const el = document.createElement('div');
                el.className = 'small-country-marker';
                el.title = code;
                
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (hideActive || showActive) return; // Same guard as polygon clicks
                    
                    if (selectedCountries.has(code)) {
                        selectedCountries.delete(code);
                    } else {
                        selectedCountries.add(code);
                    }
                    
                    updateSelectedOutline();
                    console.log('Selected countries:', Array.from(selectedCountries));
                });
                
                const marker = new maplibregl.Marker({ element: el, anchor: 'center', offset: [0, 14] })
                    .setLngLat(coords)
                    .addTo(map);
                
                smallCountryMarkers[code] = { marker, el, coords };
            });
            
            updateSmallCountryMarkerStyles();
            map.on('render', cullGlobeMarkers);
        }
        
        // Hide markers that have rotated to the far side of the globe.
        // A marker is "visible" if its angular distance from the map's
        // current center is under 90° (i.e. the two unit vectors on the
        // sphere have a positive dot product).
        function cullGlobeMarkers() {
            const center = map.getCenter();
            const cLat = center.lat * Math.PI / 180;
            const cLng = center.lng * Math.PI / 180;
            
            Object.values(smallCountryMarkers).forEach(({ el, coords }) => {
                if (el.style.display === 'none') return; // already hidden by hide/show filter
                
                const [lng, lat] = coords;
                const pLat = lat * Math.PI / 180;
                const pLng = lng * Math.PI / 180;
                
                const dot = Math.sin(cLat) * Math.sin(pLat) +
                            Math.cos(cLat) * Math.cos(pLat) * Math.cos(pLng - cLng);
                
                el.style.visibility = dot > 0 ? '' : 'hidden';
            });
        }
        
        // Keep marker appearance in sync with selection / active filter state
        function updateSmallCountryMarkerStyles() {
            Object.entries(smallCountryMarkers).forEach(([code, { el }]) => {
                const filterActive = hideActive || showActive;
                const isSelected = selectedCountries.has(code) && !filterActive;
                el.classList.toggle('selected', isSelected);
                el.classList.toggle('disabled', filterActive);
                el.style.display = filterActive ? 'none' : '';
            });
        }
        
        // Function to update URL with current selection
        function updateURL() {
            const url = new URL(window.location);
            
            if (selectedCountries.size === 0) {
                url.searchParams.delete('hide');
                url.searchParams.delete('show');
            } else {
                const countryList = Array.from(selectedCountries).join(',');
                
                if (hideActive) {
                    url.searchParams.set('hide', countryList);
                    url.searchParams.delete('show');
                } else if (showActive) {
                    url.searchParams.set('show', countryList);
                    url.searchParams.delete('hide');
                }
            }
            
            window.history.pushState({}, '', url);
        }
        
        // Wait for map to be idle and build the mapping
        map.once('idle', () => {
            const countryFeatures = map.querySourceFeatures('maplibre', {
                sourceLayer: 'countries'
            });
            
            console.log('Found features:', countryFeatures.length);
            
            countryFeatures.forEach(feature => {
                const code = feature.properties.ADM0_A3;
                const abbrev = feature.properties.ABBREV;
                if (code && abbrev) {
                    codeToAbbrev[code] = abbrev;
                    abbrevToCode[abbrev] = code;
                }
                
                if (!crimeaMatchKey) {
                    const match = findCrimeaMatch(feature.properties);
                    if (match) {
                        crimeaMatchKey = match.key;
                        crimeaMatchValue = match.value;
                        console.log('Crimea detected via property', match.key, '=', match.value);
                    }
                }
            });
            
            console.log('Code to abbrev mapping:', codeToAbbrev);
            if (!crimeaMatchKey) {
                console.warn('Crimea feature not detected — check candidate property names in findCrimeaMatch()');
            }
            
            // Auto-apply if only one parameter
            if (hasOnlyHide) {
                selectedCountries = new Set(countriesToHide);
                hideCountries(countriesToHide);
                hideActive = true;
                updateButtonStyles();
            } else if (hasOnlyShow) {
                selectedCountries = new Set(countriesToShow);
                showOnlyCountries(countriesToShow);
                showActive = true;
                updateButtonStyles();
            } else if (hasUrlParams) {
                // Both parameters - populate selection but don't apply
                selectedCountries = new Set([...countriesToHide, ...countriesToShow]);
            }
            
            buildSmallCountryMarkers();
        });
        
        // Handle country clicks for selection (only if no URL params or filters not active)
        map.on('click', 'countries-fill', (e) => {
            if (hideActive || showActive) return; // Don't allow selection when filters are active
            
            const feature = e.features[0];
            const isCrimea = crimeaMatchKey && findCrimeaMatch(feature.properties);
            const countryCode = isCrimea ? 'UKR' : feature.properties.ADM0_A3;
            
            if (selectedCountries.has(countryCode)) {
                selectedCountries.delete(countryCode);
            } else {
                selectedCountries.add(countryCode);
            }
            
            updateSelectedOutline();
            console.log('Selected countries:', Array.from(selectedCountries));
        });
        
        // Change cursor on hover
        map.on('mouseenter', 'countries-fill', () => {
            if (!hideActive && !showActive) {
                map.getCanvas().style.cursor = 'pointer';
            }
        });
        
        map.on('mouseleave', 'countries-fill', () => {
            map.getCanvas().style.cursor = '';
        });
        
        // Handle clicks on the country label text (same toggle behavior as the fill)
        map.on('click', 'countries-label', (e) => {
            if (hideActive || showActive) return; // Don't allow selection when filters are active
            
            const abbrev = e.features[0].properties.ABBREV;
            const countryCode = abbrevToCode[abbrev];
            if (!countryCode) return;
            
            if (selectedCountries.has(countryCode)) {
                selectedCountries.delete(countryCode);
            } else {
                selectedCountries.add(countryCode);
            }
            
            updateSelectedOutline();
            console.log('Selected countries:', Array.from(selectedCountries));
        });
        
        // Change cursor on hover over labels
        map.on('mouseenter', 'countries-label', () => {
            if (!hideActive && !showActive) {
                map.getCanvas().style.cursor = 'pointer';
            }
        });
        
        map.on('mouseleave', 'countries-label', () => {
            map.getCanvas().style.cursor = '';
        });
        
        // Create dialog
        const dialog = document.createElement('div');
        dialog.style.cssText = `
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 24px 32px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 1000;
            backdrop-filter: blur(10px);
        `;
        dialog.innerHTML = `
            <div style="margin-bottom: 16px; font-size: 18px; font-weight: 600; color: white;">
                Hide and Seek
            </div>
            <div style="display: flex; gap: 12px;">
                <button id="hideBtn" style="
                    flex: 1;
                    padding: 12px 24px;
                    border: none;
                    border-radius: 8px;
                    background: rgba(255,255,255,0.5);
                    color: #667eea;
                    font-size: 15px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s ease;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(0,0,0,0.15)';" 
                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.1)';">
                    Hide
                </button>
                <button id="showBtn" style="
                    flex: 1;
                    padding: 12px 24px;
                    border: none;
                    border-radius: 8px;
                    background: rgba(255,255,255,0.5);
                    color: #667eea;
                    font-size: 15px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s ease;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(0,0,0,0.15)';" 
                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.1)';">
                    Show
                </button>
                <button id="clearBtn" style="
                    flex: 1;
                    padding: 12px 24px;
                    border: none;
                    border-radius: 8px;
                    background: rgba(255,255,255,0.3);
                    color: white;
                    font-size: 15px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s ease;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(0,0,0,0.15)';" 
                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.1)';">
                    Clear
                </button>
            </div>
        `;
        document.body.appendChild(dialog);
        
        const hideBtn = document.getElementById('hideBtn');
        const showBtn = document.getElementById('showBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        function updateButtonStyles() {
            if (hideActive) {
                hideBtn.style.background = 'white';
                hideBtn.style.color = '#667eea';
            } else {
                hideBtn.style.background = 'rgba(255,255,255,0.5)';
                hideBtn.style.color = '#667eea';
            }
            
            if (showActive) {
                showBtn.style.background = 'white';
                showBtn.style.color = '#667eea';
            } else {
                showBtn.style.background = 'rgba(255,255,255,0.5)';
                showBtn.style.color = '#667eea';
            }
            
            updateSmallCountryMarkerStyles();
        }
        
        // Handle Hide button clicks
        hideBtn.addEventListener('click', () => {
            if (selectedCountries.size === 0) return;
            
            if (hideActive) {
                // Deactivate - show all countries with selection outlined
                showAllCountries();
                hideActive = false;
                updateSelectedOutline();
            } else {
                // Activate - hide selected countries and remove outline
                hideCountries(Array.from(selectedCountries));
                hideActive = true;
                showActive = false;
                map.getSource('selected-countries').setData({
                    type: 'FeatureCollection',
                    features: []
                });
            }
            updateButtonStyles();
            updateURL();
        });
        
        // Handle Show button clicks
        showBtn.addEventListener('click', () => {
            if (selectedCountries.size === 0) return;
            
            if (showActive) {
                // Deactivate - show all countries with selection outlined
                showAllCountries();
                showActive = false;
                updateSelectedOutline();
            } else {
                // Activate - show only selected countries and remove outline
                showOnlyCountries(Array.from(selectedCountries));
                showActive = true;
                hideActive = false;
                map.getSource('selected-countries').setData({
                    type: 'FeatureCollection',
                    features: []
                });
            }
            updateButtonStyles();
            updateURL();
        });
        
        // Handle Clear button clicks
        clearBtn.addEventListener('click', () => {
            selectedCountries.clear();
            hideActive = false;
            showActive = false;
            showAllCountries();
            updateSelectedOutline();
            updateButtonStyles();
            updateURL();
        });
    });
</script>
</body>
</html>
